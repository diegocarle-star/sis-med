{% extends "base.html" %}
{% block title %}Nuevo Medicamento{% endblock %}
{% block topbar_title %}Nuevo Medicamento — Vademécum{% endblock %}
{% block content %}
<div class="breadcrumb"><a href="/vademecum">Vademécum</a> › Nuevo</div>
<div class="page-header"><h1>Agregar Medicamento</h1></div>
<div class="card" style="max-width:640px;">
  <div class="card-body">
    <form method="post">
      <div class="form-grid">
        <div class="form-group"><label>Monodroga</label><input name="monodrogra" required placeholder="Ej: Adalimumab"></div>
        <div class="form-group"><label>Nombre Comercial</label><input name="nombre_comercial" placeholder="Ej: Humira"></div>
        <div class="form-group"><label>Presentación</label><input name="presentacion" placeholder="Ej: Jeringa 40mg"></div>
        <div class="form-group"><label>Laboratorio</label><input name="laboratorio" placeholder="Ej: AbbVie"></div>
        <div class="form-group"><label>Segmento</label>
          <select name="segmento">
            <option>Ambulatorio</option><option>Cronicidad</option><option>Diabetes</option><option>Alto Costo</option>
          </select>
        </div>
        <div class="form-group"><label>Condición</label>
          <select name="condicion">
            <option>Autorizado</option><option>Con Auditoría</option>
          </select>
        </div>
      </div>
      <div class="form-actions">
        <a href="/vademecum" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
