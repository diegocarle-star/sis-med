{% extends "base.html" %}
{% block title %}Nueva Orden de Compra{% endblock %}
{% block topbar_title %}Nueva Orden de Compra{% endblock %}
{% block content %}
<div class="breadcrumb"><a href="/compras">Compras</a> › Nueva</div>
<div class="page-header"><h1>Solicitar Presupuesto / Orden de Compra</h1></div>
<div class="card" style="max-width:640px;">
  <div class="card-body">
    <form method="post">
      <div class="form-grid">
        <div class="form-group" style="grid-column:1/-1;"><label>Proveedor</label>
          <select name="proveedor_id" required>
            {% for p in db.proveedores %}<option value="{{ p.id }}">{{ p.nombre }}</option>{% endfor %}
          </select>
        </div>
        <div class="form-group"><label>Cantidad de ítems</label><input name="items" type="number" min="1" value="1"></div>
        <div class="form-group"><label>Total estimado ($)</label><input name="total" type="number" placeholder="0"></div>
      </div>
      <div class="form-actions">
        <a href="/compras" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary">Crear orden</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
