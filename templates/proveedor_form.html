{% extends "base.html" %}
{% block title %}Nuevo Proveedor{% endblock %}
{% block topbar_title %}Nuevo Proveedor{% endblock %}
{% block content %}
<div class="breadcrumb"><a href="/proveedores">Proveedores</a> › Nuevo</div>
<div class="page-header"><h1>Registrar Proveedor</h1></div>
<div class="card" style="max-width:640px;">
  <div class="card-body">
    <form method="post">
      <div class="form-grid">
        <div class="form-group" style="grid-column:1/-1;"><label>Nombre de la empresa</label><input name="nombre" required placeholder="Ej: Droguería Del Sud S.A."></div>
        <div class="form-group"><label>CUIT</label><input name="cuit" placeholder="30-70000000-0"></div>
        <div class="form-group"><label>Tipo</label><select name="tipo"><option>Droguería</option><option>Laboratorio</option><option>Distribuidor</option></select></div>
        <div class="form-group"><label>Email</label><input name="email" type="email" placeholder="contacto@empresa.com.ar"></div>
        <div class="form-group"><label>Teléfono</label><input name="telefono" placeholder="(0351) 000-0000"></div>
      </div>
      <div class="form-actions">
        <a href="/proveedores" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary">Guardar proveedor</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
